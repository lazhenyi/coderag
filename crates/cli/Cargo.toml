[package]
name = "coderag-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for CodeRAG — AST-based code RAG system"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "coderag"
path = "src/main.rs"

[dependencies]
coderag-core = { version = "0.1", path = "../core" }
coderag-storage = { version = "0.1", path = "../storage" }
coderag-indexer = { version = "0.1", path = "../indexer" }
coderag-server = { version = "0.1", path = "../server" }
tokio.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile = "3"
