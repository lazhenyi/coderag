[package]
name = "coderag-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Git operations, multi-language AST parsing, symbol extraction, chunking, and embedding"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
git2 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
linked-hash-map = "0.5"
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }

# Tree-sitter
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-swift = { workspace = true }
tree-sitter-php = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-scala = { workspace = true }
tree-sitter-dart = { workspace = true }
tree-sitter-lua = { workspace = true }
tree-sitter-perl = { workspace = true }
tree-sitter-r = { workspace = true }
tree-sitter-sequel = { workspace = true }

# tree-sitter-kotlin-sg uses tree-sitter-language 0.1, compatible with tree-sitter 0.26.8
tree-sitter-kotlin-sg = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
