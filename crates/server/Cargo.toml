[package]
name = "coderag-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Web API server for CodeRAG"

[dependencies]
coderag-core = { path = "../core", features = ["doc-p0"] }
coderag-storage = { path = "../storage" }
coderag-indexer = { path = "../indexer" }

actix-web = "4"
actix-cors = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
dirs = { workspace = true }
parking_lot = "0.12"

# Frontend embedding
lazy_static = "1"
md5 = "0.7"
mime_guess2 = "2"
brotli = "7"

[build-dependencies]
md5 = "0.7"
flate2 = "1.0"
brotli = "7"
