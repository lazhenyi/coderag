[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/storage",
    "crates/indexer",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["CodeRAG Team"]
license = "MIT"
rust-version = "1.93.0"

[workspace.dependencies]
# Git
git2 = "0.20.4"

# Tree-sitter
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-go = "0.25.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Vector storage
qdrant-client = "1"

# Utilities
thiserror = "2.0.18"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
rayon = "1"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
